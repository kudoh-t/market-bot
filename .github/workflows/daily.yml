name: Daily Market Bot

on:
  schedule:
    - cron: "0 22 * * *"   # 日本時間 7:00 = UTC 22:00
  workflow_dispatch:       # 手動実行ボタンを有効化

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        # requirements.txt に記載された全てのライブラリをインストールします
        # (requests, beautifulsoup4, google-generativeai, tenacity など)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # --- キャッシュ設定 ---
      # 取得失敗時に前回のデータを参照するための設定です
      - name: Cache Market Data
        uses: actions/cache@v3
        with:
          path: market_cache.pkl
          key: market-data-cache-${{ github.run_id }}
          restore-keys: |
            market-data-cache-
      # -----------------------

      - name: Run script
        env:
          # GitHubのリポジトリ設定 > Secrets and variables > Actions で登録した値を読み込みます
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python app.py