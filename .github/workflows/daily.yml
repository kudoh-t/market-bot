name: Daily Market Bot

on:
  schedule:
    - cron: "0 22 * * *"   # JST 7:00 = UTC 22:00
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        # Geminiとの通信に必要な google-generativeai を追加しました
        run: pip install requests beautifulsoup4 google-generativeai

      # --- キャッシュ設定 ---
      - name: Cache Market Data
        uses: actions/cache@v3
        with:
          path: market_cache.pkl
          # 毎回新しいキーを生成しつつ、前回のデータを復元できるようにします
          key: market-data-cache-${{ github.run_id }}
          restore-keys: |
            market-data-cache-
      # -----------------------

      - name: Run script
        env:
          # GitHub Secretsから各キーを読み込み、Pythonプログラムに渡します
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python app.py